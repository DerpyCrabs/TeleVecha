[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "24.20.0"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/widget.html"
[headers.values]
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Embedder-Policy = "require-corp"

[[headers]]
for = "/assets/*"
[headers.values]
Cross-Origin-Embedder-Policy = "require-corp"
