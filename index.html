<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0d0f12" />
    <meta name="application-name" content="TeleVecha" />
    <meta
      name="description"
      content="TeleVecha is an unofficial, local-first web client for Telegram."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>TeleVecha</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const controllerIsLegacyShell =
        navigator.serviceWorker?.controller?.scriptURL.endsWith('/sw.js') ?? false;
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(
          registrations
            .filter((registration) => registration.active?.scriptURL.endsWith('/sw.js'))
            .map((registration) => registration.unregister()),
        );
      }
      if ('caches' in globalThis) {
        const keys = await caches.keys();
        await Promise.all(
          keys.filter((key) => key.startsWith('televecha-shell-')).map((key) => caches.delete(key)),
        );
      }
      if (controllerIsLegacyShell) {
        location.reload();
        await new Promise(() => {});
      }

      await import('/src/main.tsx');
    </script>
  </body>
</html>
